<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CD 2097 - Painel de Stretchadeiras | Cobasi</title>
    <link rel="icon" href="https://play-lh.googleusercontent.com/-BnkaUGEENV4Es-ODp3fxpogBD0TRXCe7_swJBdgKBKH3gx0y2vcdZHVI_ETbx6XD9c">
    
    <!-- Google Fonts: Inter & Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./css/painel.css">
</head>
<body>
    <!-- Top Header -->
    <header class="app-header">
        <div class="header-left">
            <button id="btnToggleSidebar" class="btn-icon mobile-only" aria-label="Abrir ou fechar menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <div class="brand">
                <img src="./imgs/cobasi-logo.png" alt="Cobasi" class="brand-logo" onerror="this.style.display='none'">
                <div class="brand-title">
                    <span class="hub-code">CD 2097</span>
                    <span class="hub-divider">|</span>
                    <span class="hub-system">Stretchadeiras Tower</span>
                </div>
            </div>
        </div>

        <div class="header-right">
            <div class="user-profile" id="userProfile">
                <img src="./imgs/icon_entregador.png" alt="Perfil" id="userAvatar" class="avatar-img">
                <div class="user-meta">
                    <span class="user-name" id="headerUserName">Carregando...</span>
                    <span class="user-role" id="headerUserRole">Operador Logístico</span>
                </div>
            </div>
            <button id="btnLogout" class="btn-logout" title="Encerrar Sessão">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                <span>Sair</span>
            </button>
        </div>
    </header>

    <!-- App Body Layout -->
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="app-sidebar" id="appSidebar">
            <nav class="sidebar-nav">
                <ul class="nav-list">
                    <li class="nav-item">
                        <button class="nav-btn active" data-section="dashboard">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="7" height="9"></rect>
                                <rect x="14" y="3" width="7" height="5"></rect>
                                <rect x="14" y="12" width="7" height="9"></rect>
                                <rect x="3" y="16" width="7" height="5"></rect>
                            </svg>
                            <span class="nav-label">Dashboard</span>
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-btn" data-section="stretchadeiras">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                            </svg>
                            <span class="nav-label">Stretchadeiras</span>
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-btn" data-section="filiais">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 21h18M3 7l9-4 9 4M4 10h16v11H4z"></path>
                            </svg>
                            <span class="nav-label">Filiais</span>
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-btn" data-section="boxes">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                                <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                                <line x1="12" y1="22.08" x2="12" y2="12"></line>
                            </svg>
                            <span class="nav-label">BOX</span>
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-btn" data-section="usuarios">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                <circle cx="9" cy="7" r="4"></circle>
                                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                            </svg>
                            <span class="nav-label">Usuários</span>
                        </button>
                    </li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <span class="version-tag">Tower Control v1.0</span>
            </div>
        </aside>

        <!-- Main Dynamic Content (SPA) -->
        <main class="app-main" id="appMain">
            <!-- Content will be injected by JavaScript -->
        </main>
    </div>

    <!-- Reusable Modal Container -->
    <div id="modalOverlay" class="modal-overlay hidden">
        <div class="modal-window">
            <div class="modal-header">
                <h3 id="modalTitle" class="modal-title">Título do Modal</h3>
                <button id="modalBtnClose" class="btn-close" aria-label="Fechar">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Injected form fields -->
            </div>
        </div>
    </div>

    <!-- Notification Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="./js/painel.js"></script>
</body>
</html>
